# Throughput-only engine candidate based on AMDAHL-063/074. The current OPD
# server path packs samples into many single-row packed microbatches and then
# runs one model forward/backward per packed row. On the current 64-datum
# real all-layer SGLang-cache capture this is 22 model calls. PR #376 commit
# 10d12e74 adds opt-in `opd_packed_row_batch_size`; row_batch_size=4 groups
# those 22 packed rows into 6 backend batches with only ~3% extra padding
# (71040 -> 73216 input tokens in local packer simulation).
#
# Hypothesis: fatter packed-row model calls recover the standalone 2-node
# mbs4 utilization ceiling without changing sample content, VP-KL, topology,
# or trainer config. This is a model-execution batching change, so it must pass
# same-capture loss/KL/hidden comparison before any 4-node/static/K3 spend.
#
# Initial gates:
# 1. 2-node server-only replay with `--loss-param opd_packed_row_batch_size=4`
#    must fit and preserve the AMDAHL-063/074 same-capture loss/KL/hidden tuple.
# 2. If rowbatch4 fits and is correct, compare rowbatch8 and then repeat/fatter
#    calls only after source-rank/packing correctness is rechecked.
# 3. Not a science/default candidate until static/K3 and same-workload 4-node
#    real-cache MFU/fragmentation gates pass.
