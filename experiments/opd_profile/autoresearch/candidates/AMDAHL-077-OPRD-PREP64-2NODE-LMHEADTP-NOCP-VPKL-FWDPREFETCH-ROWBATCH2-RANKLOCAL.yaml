# Follow-up to AMDAHL-075/076 on PR #376 commit a9f2e2c1. Executor-global
# packed-row batching was fast but changed which source rank owned original
# packed rows; hidden-state sidecars already showed source-rank-sensitive drift.
# This candidate applies rowbatch2 only after each trainer rank selects its
# normal data slice, preserving the original rank ownership while collapsing
# two real local rows into one packed-varlen model call where possible.
#
# Promotion gates:
# 1. Same-capture 2-node replay must preserve the AMDAHL-048/063 real-cache
#    loss/KL/hidden tuple (`2.3550419` / `2.3337436` / `0.0212984`).
# 2. It must beat the current correctness-clean 2-node AMDAHL-074/063 wall time
#    enough to justify a 4-node/static/K3 spend.
# 3. No science/default promotion until static/K3 and same-workload 4-node
#    real-cache throughput gates pass.
