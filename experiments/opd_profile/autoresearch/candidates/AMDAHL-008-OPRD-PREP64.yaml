# Current-node MFU probe (2026-06-13): same ARITH-020 OPRD objective and
# 64-prompt science-regime window, but coalesce trainer fb calls from 2x32
# (AMDAHL-007) to 1x64 prepare batch. This is an infra smoke, not a trajectory
# run.
#
# Compare against:
#   ARITH-020 prep16 tail: forward_backward_s mean ~18.6, 4 fb calls.
#   AMDAHL-007 prep32:    forward_backward_s mean ~8.7, 2 fb calls.
# Result (2026-06-13 smoke): PROMOTE for the 64-prompt science-regime path.
# Non-warmup forward_backward_s mean 4.91 s, step_total_s mean 15.34 s,
# valid_tokens_per_step_s mean 264, health intact (`opd_frac_answer=1`,
# `opd_oprd_num_layers=40`, balanced 2-sampler routing, 2/2 sync success).
