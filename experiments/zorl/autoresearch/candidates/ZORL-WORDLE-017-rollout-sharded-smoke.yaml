notes:
  - Direct multi-turn Wordle reward baseline. This intentionally uses score_mode=rollout, not teacher_forced or opsd_kl.
  - Each candidate is scored by rollout_completion, which rebuilds the Wordle prompt with prior guesses and feedback after every turn.
  - Sixteen direct SGLang workers own four antithetic pairs each; SMG routes scoring to the candidate owner with X-SMG-Target-Worker.
  - Probe exact_rate is the main "student can solve games" signal; reward_mean includes format, information gain, solve reward, and turn bonus.
