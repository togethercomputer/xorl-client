buffer_label: amdahl-061-oprd-prep64-2node-lmheadtp-nocp-vpkl-prefetch
# Throughput-only two-node screen for the current real all-layer SGLang-cache
# path. Same workload as the AMDAHL-048 2-node DeepEP/SMS36 baseline, but sets
# `enable_forward_prefetch:true` in the trainer config.
#
# Hypothesis: AMDAHL-051 was neutral on one node because memory pressure leaves
# too little room for useful FSDP module prefetch overlap. The two-node topology
# has ep_fsdp=2 and materially more memory headroom; if communication overlap is
# the missing win, prefetch should reduce model forward/backward wall here.
#
# Not a science/default candidate and not promotable without static/K3 plus the
# same-workload 4-node real-cache gate. It must beat the AMDAHL-048 2-node
# baseline (`server_forward_backward_s=4.4441`, loss `2.3550419`) with matching
# loss before spending wider gates.
#
# Result 2026-06-15: rejected for promotion despite a real speed win. The
# trainer-only replay ran on trainer-head `research-common-h100-077` plus
# worker-1 `research-common-h100-089` with explicit `nodeSelector:
# node-group=nccl,node-pool=compute` and the same AMDAHL-048 capture/loss
# overrides. Mean over 3 measured rows after warmup was
# `server_forward_backward_s=3.677469`, `api_wall_s=3.863640`,
# `model_forward_s=0.806941`, `backward_compute_s=1.689998`,
# `clear_gradients_s=0.520730`, loss `2.359620273`, and
# `opd_kl=2.338320834`. Versus AMDAHL-048 this is a strong wall-time win
# (`server_forward_backward_s` -17.25%, API wall -18.26%), but KL/loss shift by
# about `+0.00458` on the same capture while hidden loss is unchanged. Treat
# `enable_forward_prefetch:true` as a correctness-risk speed lever for this path
# until the KL drift is explained; do not spend 4-node/static/K3 promotion gates
# on AMDAHL-061 as-is.
