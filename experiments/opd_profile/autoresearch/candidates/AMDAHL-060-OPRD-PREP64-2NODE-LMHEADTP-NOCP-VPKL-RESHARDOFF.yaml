buffer_label: amdahl-060-oprd-prep64-2node-lmheadtp-nocp-vpkl-reshardoff
# Throughput-only two-node topology/engine screen for the current real all-layer
# SGLang-cache path. Same workload as the AMDAHL-048 2-node DeepEP/SMS36
# baseline, but sets `reshard_after_forward:false` in the trainer config.
#
# Hypothesis: the 2-node baseline has enough FSDP memory headroom that keeping
# parameters gathered after forward can remove repeated all-gather/reshard
# traffic during activation-checkpointed backward. If peak memory rises into OOM
# or the wall-time win is inside noise, reject it. This is intentionally not a
# one-node screen because the 1-node memory-pressure root cause leaves little
# headroom for gathered params.
#
# Not a science/default candidate and not promotable without static/K3 plus the
# same-workload 4-node real-cache gate. It must beat the AMDAHL-048 2-node
# baseline (`server_forward_backward_s=4.4441`, loss `2.3550419`) with matching
# loss before spending wider gates.
#
# Result 2026-06-15: rejected. A first replay client used bad shell quoting for
# `teacher_heads` and wrote an empty JSONL; ignore that artifact. The corrected
# replay completed on trainer-head `research-common-h100-110` plus worker-1
# `research-common-h100-092` with `teacher_heads` parsed as JSON. Mean over 3
# measured rows after warmup was `server_forward_backward_s=4.443982`,
# `api_wall_s=4.643382`, `model_forward_s=1.249282`,
# `backward_compute_s=1.738238`, `clear_gradients_s=0.762611`, loss
# `2.355553985`, and `opd_kl=2.334234441`. Versus the AMDAHL-048 2-node
# baseline, server wall is effectively flat (-0.003%), API wall is only 1.77%
# lower, backward is 15.9% lower but model forward and clear-gradients increase.
# The same-capture loss/KL shift is small (+0.00051/+0.00049) but the total wall
# result is not a meaningful win. Do not promote `reshard_after_forward:false`.
