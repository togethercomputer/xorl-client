notes:
  - Rank-32 full-pool ES port of the no-filler OPSD (single-shot) 4x4-multiplication recipe, testing whether the rank-4 LoRA capacity limit was why ES stayed flat at ~10 percent. Student input is the chat-template user turn plus the literal Answer cue (no CoT, no filler), and it samples the answer directly. Teacher input is the same user turn with the precomputed CoT inserted as private scratch before the same Answer cue (self-distill, same base weights). Full-vocab forward KL is scored server-side over the student-sampled answer positions only.
  - TASK=mult, SCORE_MODE=opsd_kl_full, single-shot (OPSD_MULTI_TURN omitted, so it defaults to 0 - this is NOT multi-turn). LoRA rank/alpha bumped 4 to 32; starts COLD from a fresh rank-32 init adapter at a dedicated ADAPTER_DIR (qwen3-30b-a3b-r32-multopsd003), NOT the default qwen3-30b-a3b-r4 path which holds an incompatible rank-4 adapter that the script would otherwise reuse.
  - Full combined pool of 23 good sglang replicas (pool A zorl-ar-sglang 0..15 plus pool B zorl-ar-sglang-b 0,2..7; b-1 EXCLUDED as flaky). pair_shard sharding with NUM_SHARDS=auto resolves to 23 shards (one per URL); PAIRS_PER_SHARD=5 so global num_pairs becomes 5x23=115, population 2x115=230 candidates, 10 candidates per replica which stays under the rank-32 LoRA pool cap of max-loaded-loras=12.
  - Cold base-30B headroom (eval_mult_baseline.py, N=64, greedy) is direct_accuracy 0.031 with empty_frac 0.0 - near-zero direct accuracy, large room to climb. PROBE_TEMPERATURE=0.0 reads GREEDY direct accuracy (the headline) every PROBE_INTERVAL=10 steps; watch the probe exact_count rise from the cold floor.
  - Pool note - only ONE ZORL client can run on these pools at a time. Do not launch while another client holds the pool.
