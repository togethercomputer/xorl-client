# Throughput-only one-node engine screen for the current real all-layer
# SGLang-cache path. Same topology/workload as the AMDAHL-044/048/051/053/054/056
# DeepEP/SMS36 baseline, but the engine defers the detached scalar loss-report
# all-reduce until after all packed microbatches finish backward.
#
# Hypothesis: reporting-only scalar all-reduces currently serialize every
# microbatch immediately after backward. Reducing once per forward_backward call
# should not change gradients or optimizer state, but may reduce server wall and
# improve overlap on the packed real-cache replay.
#
# Not a science/default candidate and not promotable without static/K3 plus the
# same-workload 4-node real-cache gate. If it does not beat the chunk4/SMS36
# baseline (`server_forward_backward_s=4.6591`, loss `2.3550419`) by more than
# noise with matching loss, reject it.
#
# Result 2026-06-15: rejected. Mean server/API wall regressed to
# 4.803969s/5.006521s with matching loss. The local engine reporting patch was
# reverted/not promoted after the replay; this YAML is retained as the measured
# negative hypothesis record only.
