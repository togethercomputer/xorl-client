          \ ]]; then\n  EXTRA_ARGS+=(--preload-candidates)\nfi\nif [[ -n \"${TRAIN_POOL_SIZE}\"\
          \ ]]; then\n  EXTRA_ARGS+=(--train-pool-size \"${TRAIN_POOL_SIZE}\")\nfi\n\
          if [[ \"${RESAMPLE_TRAIN_EACH_STEP}\" == \"1\" ]]; then\n  EXTRA_ARGS+=(--resample-train-each-step)\n\
          fi\nif [[ -n \"${EXPORT_DIR}\" ]]; then\n  EXTRA_ARGS+=(--export-dir \"\
          ${EXPORT_DIR}\" --export-interval \"${EXPORT_INTERVAL}\")\nfi\n\nif [[ -n\
          \ \"${WANDB_PROJECT}\" ]]; then\n  WANDB_RUN_NAME=\"${WANDB_NAME:-${AUTORESEARCH_ID:-${SESSION_ID}}}\"\
          \n  WANDB_RUN_ID_VALUE=\"${WANDB_RUN_ID:-${SESSION_ID}}\"\n  WANDB_GROUP_VALUE=\"\
          ${WANDB_GROUP:-${AUTORESEARCH_ID:-standalone-zorl}}\"\n  echo \"Starting\
          \ W&B forwarder: project=${WANDB_PROJECT} name=${WANDB_RUN_NAME} run_id=${WANDB_RUN_ID_VALUE}\
          \ group=${WANDB_GROUP_VALUE}\"\n  (\n    for i in $(seq 1 120); do\n   \
          \   if [[ -f \"${RUN_DIR}/zorl_client.log\" ]]; then\n        break\n  \
          \    fi\n      sleep 2\n    done\n    if [[ ! -f \"${RUN_DIR}/zorl_client.log\"\
          \ ]]; then\n      echo \"zorl_client.log did not appear; W&B forwarder exiting\"\
          \ >&2\n      exit 1\n    fi\n    \"${PYTHON_BIN}\" -u \"${REPO_ROOT}/experiments/zorl/standalone/wandb_log_forwarder.py\"\
          \ \\\n      --log-file \"${RUN_DIR}/zorl_client.log\" \\\n      --project\
          \ \"${WANDB_PROJECT}\" \\\n      --name \"${WANDB_RUN_NAME}\" \\\n     \
          \ --run-id \"${WANDB_RUN_ID_VALUE}\" \\\n      --group \"${WANDB_GROUP_VALUE}\"\
          \ \\\n      --job-type \"${WANDB_JOB_TYPE}\" \\\n      --follow \\\n   \
          \   --poll-seconds 30\n  ) > \"${RUN_DIR}/wandb_forwarder.log\" 2>&1 &\n\
          \  echo \"$!\" > \"${RUN_DIR}/wandb_forwarder.pid\"\nfi\n\necho \"Starting\
          \ standalone ZORL client...\"\n\"${PYTHON_BIN}\" -u -m experiments.zorl.standalone.zorl_client\
          \ \\\n  --task \"${TASK}\" \\\n  --infer-url \"${INFER_URL}\" \\\n  --adapter-dir\
          \ \"${ADAPTER_DIR}\" \\\n  --model \"${MODEL_PATH}\" \\\n  --parent-lora-name\
          \ \"${PARENT_LORA_NAME}\" \\\n  --session-id \"${SESSION_ID}\" \\\n  --steps\
          \ \"${STEPS}\" \\\n  --num-pairs \"${NUM_PAIRS}\" \\\n  --b-sigma \"${B_SIGMA}\"\
          \ \\\n  --lr \"${LEARNING_RATE}\" \\\n  --max-update-norm \"${MAX_UPDATE_NORM}\"\
          \ \\\n  --update-strategy \"${UPDATE_STRATEGY}\" \\\n  --perturbation-mode\
          \ \"${PERTURBATION_MODE}\" \\\n  --seed \"${SEED}\" \\\n  --train-size \"\
          ${TRAIN_SIZE}\" \\\n  --eval-size \"${EVAL_SIZE}\" \\\n  --rollouts-per-puzzle\
          \ \"${ROLLOUTS_PER_PUZZLE}\" \\\n  --score-mode \"${SCORE_MODE}\" \\\n \
          \ --wordle-teacher-trace-style \"${WORDLE_TEACHER_TRACE_STYLE}\" \\\n  --rollout-temperature\
          \ \"${ROLLOUT_TEMPERATURE}\" \\\n  --rollout-max-new-tokens \"${ROLLOUT_MAX_NEW_TOKENS}\"\
          \ \\\n  --score-max-workers \"${SCORE_MAX_WORKERS}\" \\\n  --score-max-workers-per-owner\
          \ \"${SCORE_MAX_WORKERS_PER_OWNER}\" \\\n  --teacher-forced-batch-size \"\
          ${TEACHER_FORCED_BATCH_SIZE}\" \\\n  --score-job-order \"${SCORE_JOB_ORDER}\"\
          \ \\\n  --probe-interval \"${PROBE_INTERVAL}\" \\\n  --probe-temperature\
          \ \"${PROBE_TEMPERATURE}\" \\\n  --probe-n \"${PROBE_N}\" \\\n  \"${EXTRA_ARGS[@]}\"\
          \ \\\n  2>&1 | tee \"${RUN_DIR}/zorl_client.log\"\n\necho \"Done. Results\
          \ in ${RUN_DIR}\"\n"
