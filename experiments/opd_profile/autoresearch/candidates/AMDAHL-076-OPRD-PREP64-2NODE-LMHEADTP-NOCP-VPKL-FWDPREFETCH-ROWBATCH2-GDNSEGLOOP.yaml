# Follow-up to AMDAHL-075. Rowbatch2 was the strongest raw trainer replay speed
# lever so far (`server_forward_backward_s=2.831341`) but concatenating packed
# rows changed the loss/KL tuple. This candidate keeps the same rowbatch2 shape
# and enables the existing GDN packed-segment loop so each `cu_seqlens` segment
# runs through the recurrent GDN kernel independently. Hypothesis: preserve the
# original packed-row GDN boundary semantics while retaining the reduced backend
# batch count (`22 -> 11`) and some of the rowbatch2 wall-time win.
#
# Promotion gates:
# 1. Same-capture 2-node server-only replay must preserve the AMDAHL-048/063
#    real-cache loss/KL/hidden tuple (`2.3550419` / `2.3337436` / `0.0212984`).
# 2. It must beat the current correctness-clean 2-node baseline materially; if
#    the GDN segment loop makes it slower than AMDAHL-074/063, reject it as a
#    useful diagnostic but not a throughput candidate.
# 3. No science/default promotion until static/K3 and same-workload 4-node
#    real-cache throughput gates pass.
