# AMDAHL PROBE 004 (2026-06-13): end-to-end confirmation of the TEACHER HIDDEN-CAPTURE
# FIX (SGLang scheduler_output_processor_mixin: index seq_hidden[keep] on-GPU before
# .tolist() instead of materializing+shipping all positions). Validated in isolation:
# bit-exact parity, ~13-15x teacher prefill (690 -> ~9000 tok/s/GPU). Same shape as
# A-002/003 (512 prompts, prepare batch 64, concurrency 16, microbatch 256, 3 steps,
# evals off, 3 teachers + power_of_two, opd_pipeline_depth=1). Expect: teacher_prefill_wall
# ~120s -> ~8-12s, step ~130s -> ~40-50s (TRAINER-BOUND, fb ~29s). Read steady steps 1-2
# (step 0 = teacher Triton cold-start). Deploy: restart all teachers on new $SGLANG_REPO.
