          requests:
            nvidia.com/gpu: 4
          limits:
            nvidia.com/gpu: 4
        command:
        - /bin/bash
        - -lc
        - "set -euo pipefail\n\nREPO_ROOT=/workspace/home/xorl-apanda-dev-zorl-consolidated\n\
