notes:
  - Sixteen-worker Wordle OPSD teacher-forced run with SMG target-worker routing and disk exports.
  - Each SGL owns 32 antithetic pairs, or 64 local candidate LoRAs, matching max-loras-per-batch=64.
  - PRELOAD_CANDIDATES=0 avoids the unsafe full 64-LoRA preload path that triggered Triton illegal-memory failures under concurrent scoring.
  - SCORE_MAX_WORKERS_PER_OWNER=4 is the measured stable per-SGL cap; 8 concurrent candidate requests per SGL restarted the workers.
  - SCORE_MAX_WORKERS=64 with TEACHER_FORCED_BATCH_SIZE=8 targets 4 requests and 32 scored sequences per SGL in each wave; batch 16 was unstable under the same cap.
