id: AMDAHL-015-OPRD-PREP64-DEEPEP12
base_config: AM
slug: amdahl-015-oprd-prep64-deepep12
buffer_label: amdahl-015-oprd-prep64-deepep12
# Semantic-preserving current-node DeepEP SMS probe (2026-06-13): same strict
# fresh-sample 64-prompt OPRD window as AMDAHL-009, but reduce DeepEP reserved
# SMs from 24 to 12. Hypothesis: the small prep64 OPRD call may be compute-SM
# constrained rather than all-to-all constrained, so DeepEP24 could be stealing
# too many SMs from model forward/backward.
#
# Compare against AMDAHL-009:
#   step_total_s mean 15.11 s, forward_backward_s mean 4.78 s,
#   prepare_s mean 6.62 s, sync_inference_weights_s mean 3.25 s,
#   valid_tokens_per_step_s mean 267.9, pipeline_rl_active=0.
# Result (2026-06-13T190828Z): positive strict-semantics result but superseded
# by AMDAHL-016. Non-warmup steps 2-5: step_total_s=14.75,
# forward_backward_s=4.69, prepare_s=5.88, sync_inference_weights_s=3.39,
# valid_tokens_per_step_s=276.7, pipeline_rl_active=0, 2/2 sync success.
