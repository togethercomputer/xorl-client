buffer_label: amdahl-064-oprd-prep128-2node-lmheadtp-nocp-vpkl-fwdprefetch-repeat2
# Throughput-only fit/scale screen for the current real all-layer SGLang-cache
# path. Reuses the AMDAHL-063 loss-clean 2-node trainer config and replays the
# same full64 capture with `--repeat-data 2`, giving a 128-datum static f/b call.
#
# Hypothesis: the one-node repeat2 screen (AMDAHL-052) OOMed because the current
# one-node memory envelope could not absorb the fatter FSDP pre-backward
# all-gather. The 2-node no-CP/lm-head-TP VP-KL path has lower per-rank FSDP
# pressure and forward-only prefetch is now loss-clean, so repeat2 may fit and
# should expose whether larger current-path calls improve executed-token
# throughput enough to justify a real prepare-batch increase and later 4-node
# validation.
#
# Not a science/default candidate and not promotable without same-capture loss
# parity, static/K3, and same-workload 4-node real-cache validation.
#
# Measured 2026-06-15 05:02Z on `research-common-h100-089/092`. It fit and
# improved valid-token throughput versus AMDAHL-048/063, but it shifted
# same-capture loss/KL/hidden from AMDAHL-048/063:
# loss 2.355820715 vs 2.355041921, KL 2.334518359 vs 2.333743553, hidden
# 0.021302296 vs 0.021298385. Treat as throughput-positive evidence for fatter
# calls plus a packing/aggregation correctness caveat, not a promotion.
