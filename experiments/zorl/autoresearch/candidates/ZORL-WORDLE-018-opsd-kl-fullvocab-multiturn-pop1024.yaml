notes:
  - MULTI-TURN full-vocab OPSD via ZORL (the learner setup; 017 single-shot confirmed it can inject but not generalize, eval flat 0/128).
  - score_mode=opsd_kl_full + OPSD_MULTI_TURN=1. The parent plays the real 6-turn Wordle game (rollout_capture); each TURN prompt carries the running G/Y/B feedback. Per turn the hinted teacher (same feedback history + private answer) is cached on every replica and each candidate is rewarded by -mean full-vocab forward KL(teacher||student) over the parent turn reply. Per-turn rewards averaged to a per-example reward.
  - The feedback in each turn is what lets the injected behavior GENERALIZE (single-shot had no information to find an unseen word). Watch eval exact_rate move off 0 at the step-16 probe if multi-turn distillation teaches feedback-use.
  - CANDIDATE_ROUTING=owner (DIRECT to owner replica) because the SMG strips the opd_kl JSON field on forward; teacher_set is broadcast to all 16 control replicas (per-replica cache).
  - Perf: train_size=4 x ~3-6 turns x per_owner=32 ~= 384-512 co-batched units/replica (017 ran 512 clean). Forward-only prefill. Tune train_size/per_owner from observed t_score.
  - Caveat (shared with the gradient arm): the hinted teacher is a privileged expert (knows the answer), so part of its signal is non-inferable; a stronger unhinted/algorithmic teacher would be a better target. This run tests whether multi-turn ES OPSD learns at all vs the gradient arm.
