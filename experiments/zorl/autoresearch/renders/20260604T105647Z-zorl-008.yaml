        - name: INFER_URL
          value: "http://zorl-ar-sglang-047.apanda.svc.cluster.local:30000 http://zorl-ar-sglang-117.apanda.svc.cluster.local:30000\
            \ http://zorl-ar-sglang-001.apanda.svc.cluster.local:30000"
