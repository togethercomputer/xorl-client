# Tooling replay candidate for the PR #375 real-cache path.
#
# Purpose: same real all-layer SGLang-cache workload and topology as the current
# AMDAHL-044/047/048 pack4096 chunk4 path, but replay the captured data twice in
# a single trainer-server forward_backward call. Earlier static repeat-data
# ladders showed fatter calls can improve executed-token throughput, but those
# measurements predated the real all-layer SGLang-cache, valid-only gather, and
# no-CP lm-head-TP VP-KL path. This screens whether the current memory shape can
# still benefit from a larger call before trying any generated-batch recipe.
#
# Throughput-only replay candidate. Do not use repeated data for correctness,
# K3/static, or science defaults. Not promotable without a same-workload 4-node
# real-cache gate and a generated-batch/full-OPD gate if the prepare window
# changes.
