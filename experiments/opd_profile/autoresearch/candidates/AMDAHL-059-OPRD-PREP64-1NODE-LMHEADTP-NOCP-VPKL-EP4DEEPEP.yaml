# Throughput-only one-node topology screen for the current real all-layer
# SGLang-cache path. Same workload as the AMDAHL-044/048/058 DeepEP/SMS36
# baseline, but expert_parallel_size is 4 instead of 8. On one 8-GPU node this
# makes the expert mesh EP4 x ep_fsdp2 instead of EP8 x ep_fsdp1.
#
# Hypothesis: the current EP8 singleton expert-FSDP shape may be the poor
# backward/communication point. EP4 narrows DeepEP exchange groups while keeping
# per-rank expert parameter memory roughly comparable through ep_fsdp=2. If the
# extra expert FSDP all-gather/reduce overhead dominates, reject it quickly.
#
# Not a science/default candidate and not promotable without static/K3 plus the
# same-workload 4-node real-cache gate. It must beat the chunk4/SMS36 baseline
# (`server_forward_backward_s=4.6591`, loss `2.3550419`) with matching loss.
#
# Result 2026-06-15: rejected. First launch reached EP4 mesh setup but failed
# loading EP8-shaped optimizer state from the DCP checkpoint. The retry used the
# default-true engine knob `load_checkpoint_optimizer:false` only for this
# server-only topology screen. It measured `server_forward_backward_s=4.5983`
# and `api_wall_s=4.8492` (1.3%/2.6% faster than baseline), but shifted reported
# loss/KL to `2.3731350`/`2.3518243` from the baseline `2.3550419`/`2.3337434`.
# Do not promote EP4 or spend 4-node/static/K3 gates without first explaining
# and eliminating that loss drift.
