notes:
  - On-policy OPSD via ZORL/ES (reverse-KL reward), on the §3d-fixed zorl-ar-sglang pool.
  - score_mode=opsd_kl - each candidate (student) samples a HINT-FREE CoT, then the frozen
    base teacher (lora_path=None) with the HINTED prefix is scored on that same CoT; reward =
    mean(teacher_logprob - student_logprob) = single-sample estimate of -KL(student||teacher).
  - Prompts come from wordle.build_opsd_prompts, identical to train_opsd_baseline._asymmetric_prompt_ids,
    so this ES run and the gradient/GRPO run distill from the same teacher context.
  - This reward GENERATES per (candidate x example), far heavier than teacher-forced scoring, so
    TRAIN_SIZE=8 + ROLLOUT_MAX_NEW_TOKENS=96 + per_owner=4. Tune from observed step time.
  - Probe is the normal multi-turn Wordle game (no hint) -> exact_rate monitors whether the
    distilled student actually solves Wordle without the hint.
