id: AMDAHL-010-OPRD-PREP64-DEEPEP24-NOREC
base_config: AM
slug: amdahl-010-oprd-prep64-deepep24-norec
buffer_label: amdahl-010-oprd-prep64-deepep24-norec
# Current-node activation recompute probe (2026-06-13): same AMDAHL-009
# DeepEP24 + prep64 OPRD window, but switch gradient_checkpointing_method from
# recompute_before_dispatch to no_recompute. This tests whether the short
# 4096-packing science window can fit without activation recomputation and how
# much trainer-side utilization is still recoverable on the current nodes.
#
# Compare against:
#   AMDAHL-008 alltoall prep64: step_total_s 15.34, forward_backward_s 4.91.
#   AMDAHL-009 DeepEP24 prep64: step_total_s 15.11, forward_backward_s 4.78.
# Result (2026-06-13 smoke): FIT BUT REJECT. `no_recompute` slightly improved
# forward_backward_s versus AMDAHL-009 (4.70 vs 4.78 s) but regressed whole-step
# time (15.42 vs 15.11 s) and valid-token/s (261.5 vs 267.9) because
# optimizer/sync variance dominated. Health stayed intact (`opd_frac_answer=1`,
# `opd_oprd_num_layers=40`, balanced 2-sampler routing, 2/2 sync success).
