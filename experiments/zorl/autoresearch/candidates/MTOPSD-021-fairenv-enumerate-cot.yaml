notes:
  - FAIR ENV port (from the other agent) + enumerate-CoT distillation. Student WORDLE_PROMPT_STYLE=constraints_enumerate sees the public board-state summary (green pattern / present / excluded / likely-absent) - NO candidate list, NO target - and is asked to list the consistent words itself then narrow. Legal-word validity (vendored 693-word list) + INVALID_RETRIES=2 (illegal/repeated/unparseable guess is rejected and re-prompted, does not burn a turn). X for absent, bracketed <guess>[WORD]</guess>.
  - Teacher WORDLE_TEACHER_PROMPT_STYLE=enumerate is privileged (sees candidates + target) and demonstrates the public narrowing that lands on the target. KL over the full student CoT (forward_kl_full). The asymmetry - student sees only the board summary, teacher sees candidates+target - is the OPSD point - distilling the teacher CoT installs candidate-narrowing into the student weights WITHOUT a scaffold.
  - This supersedes MTOPSD-020 (raw transcript, no board summary, no retries - format collapsed to 0.52 at step 32). Baseline to beat = the base-30B fair eval (run separately). The gradient OPSD arm + the gradient GRPO arm (other agent) run the comparable gradient methods on this env.
  - Pool note - only ONE ZORL client can run on the zorl-ar-sglang pool at a time. The GRPO-via-ZORL (score_mode=rollout direct env reward) experiment is created separately and runs when this frees the pool.
