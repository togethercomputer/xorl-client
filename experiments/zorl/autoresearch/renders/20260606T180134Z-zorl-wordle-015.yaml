          fi\nif [[ -n \"${REWARD_INFER_URL}\" ]]; then\n  EXTRA_ARGS+=(--reward-infer-url\
          \ \"${REWARD_INFER_URL}\")\nfi\nEXTRA_ARGS+=(--population-sharding \"${POPULATION_SHARDING}\"\
          )\nEXTRA_ARGS+=(--num-shards \"${NUM_SHARDS}\")\nif [[ -n \"${PAIRS_PER_SHARD}\"\
