slug: amdahl-035-oprd-prep64-1node-lowmem-kl-fb-noprefetch
buffer_label: amdahl-035-oprd-prep64-1node-lowmem-kl-fb-noprefetch
# 1-node retry of AMDAHL-034 with manual FSDP module prefetch disabled.
# AMDAHL-034 used the validated, gradient-identical lm-head lowmem path and
# reached FSDP backward prefetch, then OOMed on a ~970 MiB all-gather with
# <1 GiB free on most ranks. The corresponding engine code uses
# enable_forward_prefetch as the gate for both set_modules_to_forward_prefetch
# and set_modules_to_backward_prefetch, so this is the narrowest fit probe for
# that observed failure.
#
# This is a TOOLING/MEMORY probe to get the FIRST real 1-node executed-MFU
# number, not a science candidate. Requires the engine on
# throughput/opd-lmhead-moe-gemm-20260614 (off origin/apanda-dev @ 609bed76).
# Verify the two new knobs actually reach loss_fn_params (model_runner reads
# params.get("opd_streaming_lowmem") and params.get("opd_vocab_chunk_size"))
# before trusting a null result.
