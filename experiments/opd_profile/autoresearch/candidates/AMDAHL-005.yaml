# AMDAHL PROBE 005 (2026-06-13): fb lever 1 — fewer/bigger microbatches. Post capture-fix
# the step is trainer-bound (fb ~27s = 8 microbatches x ~3.4s, ~6.5s of which is per-microbatch
# EP/FSDP comms overhead). prepare_batch 64->128 => 4 microbatches of 128 (512 prompts), which
# amortizes the per-microbatch overhead + larger GEMM/MoE MFU. Same shape otherwise (512 prompts,
# microbatch 256, 3 steps, evals off, capture fix on teachers). WATCH: OOM at 128-sample fb.
# Read steady steps 1-2: forward_backward_s (expect <27s), step_total_s, valid_tokens_per_step_s.
id: AMDAHL-005
base_config: AM
slug: amdahl-005-mbatch128
buffer_label: amdahl-005
trainer_config: experiments/opd_profile/configs/qwen3_6_35b_a3b_opd_opdb_8node_warm009.yaml
gdn_backend: fla
score_mode: pause_vs_nopause
score_min_control_n: 100
student_prefill_text: ' pause'
student_prefill_count: 1024
student_prefill_suffix: 'Answer: '
student_stop_sequences: '["\n"]'
teacher_cot_json_path: /shared/opd-coord/arith_ops6_nonempty_cot.json
prompts_json_path: /shared/opd-coord/arith_ops6_nonempty_prompts.json
num_prompts: 7892
default_num_steps: 3
default_prompts_per_step: 512
supervise_student_cot: false
opd_supervise_buffer_only: false
opd_hidden_match_coef: 0.0
