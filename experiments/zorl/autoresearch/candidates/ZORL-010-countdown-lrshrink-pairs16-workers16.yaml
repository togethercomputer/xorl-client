id: ZORL-010
kind: countdown
base_manifest: k8s/qwen3-coder-30b-a3b-zorl-countdown-trainer-only.yaml
container: trainer
score_source: countdown_log
result_root: experiments/zorl/results/zorl_autoresearch/ZORL-010
env:
  RESULT_ROOT: /workspace/home/xorl-apanda-dev-zorl-consolidated/experiments/zorl/results/zorl_autoresearch/ZORL-010
  INFER_URL: "http://zorl-ar-sglang-047.apanda.svc.cluster.local:30000 http://zorl-ar-sglang-117.apanda.svc.cluster.local:30000 http://zorl-ar-sglang-001.apanda.svc.cluster.local:30000"
  REWARD_INFER_URL: http://zorl-ar-smg.apanda.svc.cluster.local:30000
  TRAINER_MODE: zorl
  STEPS: "64"
  LEARNING_RATE: "5.4e-3"
  LORA_RANK: "4"
  LORA_ALPHA: "4"
  ZORL_NUM_PAIRS: "16"
  ZORL_ROLLOUTS_PER_PUZZLE: "4"
  ZORL_ROLLOUT_TEMPERATURE: "0.6"
  ZORL_B_SIGMA: "0.08"
  ZORL_REFRESH_INTERVAL: "0"
  ZORL_SCORE_BATCH_SIZE: "128"
  ZORL_SCORE_MAX_WORKERS: "16"
  ZORL_SGD_MOMENTUM: "0.0"
  ZORL_REWARD_MODE: rollout
  ZORL_ROLLOUT_EXACT_BONUS: "1.0"
  ZORL_ROLLOUT_VALID_WEIGHT: "0.15"
  ZORL_ROLLOUT_VALUE_WEIGHT: "0.10"
  ZORL_PARENT_PROBE_INTERVAL: "8"
  SYNC_QUANT: none
score_gates:
  expected_total: 32
  baseline_exact: 1
  weak_exact: 2
  promote_exact: 3
  strong_exact: 5
  min_generations: 8
notes:
  - ZORL-009 showed the same 4096 rollout budget still scores at about 2 rollouts/s
    with score_max_workers=4, despite three live SGL workers behind SMG.
  - This keeps the ZORL-009 science recipe and raises only scorer concurrency to
    test whether the serving pool is underfed by the Countdown harness.
