id: AMDAHL-016-OPRD-PREP64-DEEPEP36
base_config: AM
slug: amdahl-016-oprd-prep64-deepep36
buffer_label: amdahl-016-oprd-prep64-deepep36
# Semantic-preserving current-node DeepEP SMS probe (2026-06-13): same strict
# fresh-sample 64-prompt OPRD window as AMDAHL-009, but increase DeepEP reserved
# SMs from 24 to 36. Hypothesis: if the AMDAHL-009 server gap is MoE all-to-all
# dominated, more communication SMs may reduce forward/backward wall time.
#
# Compare against AMDAHL-009:
#   step_total_s mean 15.11 s, forward_backward_s mean 4.78 s,
#   prepare_s mean 6.62 s, sync_inference_weights_s mean 3.25 s,
#   valid_tokens_per_step_s mean 267.9, pipeline_rl_active=0.
# Result (2026-06-13T191422Z): current strict fresh-sample 64-prompt winner on
# the existing 4-node stack. Non-warmup steps 2-5: step_total_s=14.30,
# forward_backward_s=4.60, prepare_s=5.87, sync_inference_weights_s=3.39,
# valid_tokens_per_step_s=285.4, pipeline_rl_active=0, 2/2 sync success.
# This is 5.3% lower wall step and 6.5% higher valid-token/s than AMDAHL-009;
# AMDAHL-014 remains faster only if one-step-stale pipeline samples are accepted.
trainer_config: experiments/opd_profile/configs/qwen3_6_35b_a3b_opd_opdb_4node_warm009_deepep36.yaml
gdn_backend: fla
score_mode: pause_vs_nopause
score_min_control_n: 100
student_prefill_text: ' pause'
student_prefill_count: 1024
student_prefill_suffix: 'Answer: '
student_stop_sequences: '["\n"]'
teacher_cot_json_path: /shared/opd-coord/arith_ops6_nonempty_cot.json
prompts_json_path: /shared/opd-coord/arith_ops6_nonempty_prompts.json
num_prompts: 7892
default_num_steps: 6
default_prompts_per_step: 64
profile_warmup_steps: 2
supervise_student_cot: false
opd_supervise_buffer_only: false
opd_hidden_match_coef: 1.0
learning_rate: 3e-6
max_new_tokens: 64
eval_max_new_tokens: 64
eval_num_problems: 128
eval_accuracy_every: 0
eval_control_start_step: 0
eval_control_max_concurrency: 128
eval_answer_logprob_control: false
eval_answer_logprob_every: 0
eval_answer_logprob_batch_size: 64
eval_answer_logprob_max_concurrency: 16
eval_answer_logprob_distractor_control: false
opd_pipeline_rl: false
sampler_quiesce_before_sync: false
sync_method: p2p
serial_endpoint_sync: true
request_timeout: 1200
weight_sync_timeout: 900
opd_contrastive_corrupt_buffer_weight: 0.0
opd_contrastive_corrupt_answer_weight: 0.0
opd_contrastive_corrupt_buffer_mode: rotate
opd_contrastive_corrupt_buffer_span: memory_only
opd_positive_answer_weight: 0.0
opd_loss_max_clamp: 10.0
opd_prepare_batch_size: 64
opd_microbatch_size: 64
save_every: 0
client_args:
  opd_oprd_layers: every1
  opd_oprd_num_layers: 40
  opd_hidden_match_mode: mse
  eval_task: arithmetic
  eval_prompts_json_path: /shared/opd-coord/arith_ops6_eval_1024.json
  eval_corrupt_pause_control: false
  opd_mask_prompt_kl: true
  eval_heldout_num_problems: 0
