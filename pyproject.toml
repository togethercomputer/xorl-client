[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xorl-client"
dynamic = ["version"]
description = "Lightweight Python client for XoRL training service"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "XoRL Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28.0",
    "typing-extensions>=4.0.0",
    "numpy>=1.20.0",
    "hf_transfer>=0.1.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
examples = [
    "wandb>=0.15.0",
    "tinker-cookbook",
    "chz",
]
serverless = [
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]
# For sampling from dedicated endpoints
dedicated-endpoint = [
    "openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/xorl-ai/xorl-client"
Documentation = "https://github.com/xorl-ai/xorl-client/tree/main/docs"
Repository = "https://github.com/xorl-ai/xorl-client"

[tool.setuptools.dynamic]
version = {attr = "xorl_client.__version__"}
