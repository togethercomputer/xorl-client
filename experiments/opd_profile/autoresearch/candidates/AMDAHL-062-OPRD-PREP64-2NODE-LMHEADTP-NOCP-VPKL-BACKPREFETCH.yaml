# Throughput-only two-node diagnostic for the current real all-layer SGLang-cache
# path. Same workload as the AMDAHL-048 2-node DeepEP/SMS36 baseline and
# AMDAHL-061 full-prefetch screen, but sets `enable_forward_prefetch:false` and
# `enable_backward_prefetch:true`.
#
# Hypothesis: AMDAHL-061's speed win came from FSDP prefetch overlap, but its
# same-capture KL/loss drift may be caused by forward module prefetch interacting
# with recompute/lm-head materialization. Backward-only prefetch should not change
# the forward logits; if it preserves loss while reducing backward wall, it is a
# better candidate for wider gates than AMDAHL-061.
#
# Not a science/default candidate and not promotable without matching
# same-capture loss, static/K3, and the same-workload 4-node real-cache gate.
#
# 2026-06-15 04:13Z status: prepared and preflighted, not launched. Candidate /
# config YAML parse, render-control repo-root and --nnodes=2 check, and
# server-side dry-run for trainer-head service/pod plus trainer-worker-1 pod with
# explicit nccl/compute nodeSelector passed. Launch deferred because Kubernetes
# auth works but node-level accounting reports full_schedulable_8gpu_nodes=NONE.
#
# 2026-06-15 04:19Z local hardening: manual prefetch scheduling was factored into
# _configure_manual_fsdp_prefetch() and CPU-only policy tests now cover
# backward-only, forward-only, both-directions, and no-op scheduling. Validation:
# test_torch_parallelize_policies.py 18 passed; server-argument threading test
# still passed.
#
# 2026-06-15 04:22Z local hardening follow-up: prefetch flags now use
# _coerce_optional_bool_config() so string values such as "false"/"off" cannot be
# treated as truthy and accidentally enable a disabled direction. Validation:
# test_torch_parallelize_policies.py 28 passed; server-argument threading test
# still passed; py_compile for the touched scheduler/test files passed.
#
# 2026-06-15 04:33Z measured result: launched after kube auth/capacity recovered,
# using server-only replay on the same AMDAHL-048/061 capture. Artifact:
# /shared/opd-coord/encoded_reasoning/results/qwen3_6_35b_self_distill/er-opd-q36-35b-slots/fb_replay/replay-vpkl-lmheadtp-nocp-realalllayer-sglangcache-full64-2node-backprefetch-chunk4-warmed-serveronly-4x-20260615T043109Z.jsonl
# Server log:
# /shared/opd-coord/encoded_reasoning/results/qwen3_6_35b_self_distill/er-opd-q36-35b-slots/20260615T042714Z-serveronly-configAMDAHL-062-OPRD-PREP64-2NODE-LMHEADTP-NOCP-VPKL-BACKPREFETCH-er-opd-q36-35b-slots-trainer-head/server.log
# Mean over 3 measured rows after 1 warmup: server_forward_backward_s=4.280844,
# api_wall_s=4.477853, model_forward_s=1.097722,
# backward_compute_s=1.684526, clear_gradients_s=0.533312, loss=2.355041921,
# opd_kl=2.333743553, opd_hidden_match_loss=0.021298385. This matches
# AMDAHL-048 loss/KL/hidden parity and is 3.67% faster on server wall, but it is
# still 16.41% slower than rejected AMDAHL-061. Verdict: correctness-clean small
# lever only; not a standalone science/default or 4-node/static/K3 promotion.
