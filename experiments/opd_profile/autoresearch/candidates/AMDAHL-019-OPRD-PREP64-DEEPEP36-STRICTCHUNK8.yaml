id: AMDAHL-019-OPRD-PREP64-DEEPEP36-STRICTCHUNK8
base_config: AM
slug: amdahl-019-oprd-prep64-deepep36-strictchunk8
buffer_label: amdahl-019-oprd-prep64-deepep36-strictchunk8
# Strict fresh-sample prepare-overlap sweep (2026-06-13): same trainer, prompt
# window, single fb call, quack+DeepEP36 dispatch, and non-pipelined semantics as
# AMDAHL-018, but split each same-step 64-prompt prepare into eight prompt chunks
# instead of four. This tests whether finer-grained same-step overlap reduces the
# remaining strict prepare wall without adding nodes or accepting one-step-stale
# samples.
#
# Compare against AMDAHL-018:
#   step_total_s=14.03, forward_backward_s=4.68, prepare_s=5.27,
#   student_sampling_s=2.52, teacher_prefill_s=2.59,
#   sync_inference_weights_s=3.37, valid_tokens_per_step_s=292.5,
#   pipeline_rl_active=0.
#
# Outcome 2026-06-13: not promoted. First launch omitted explicit sampler flags
# while the generator default was still 1, so only one sampler endpoint was
# registered/synced even though dispatch routed across two; non-warmup mean was
# step_total_s=12.71 but sync_endpoint_success_count=1, so it is invalid. The
# corrected 2-endpoint relaunch registered both endpoints, then wedged during
# initial P2P sync with repeated Mooncake/RDMA "received packet mismatch" errors
# against 10.42.31.93:15682@mlx5_2 and was stopped. The generator default was
# changed to sampler_replicas=2 afterward. Do not promote chunk8 without a clean
# 2/2-sync rerun; the invalid 1-sync row also did not improve strict prepare
# versus AMDAHL-018 (5.28 s vs 5.27 s).
