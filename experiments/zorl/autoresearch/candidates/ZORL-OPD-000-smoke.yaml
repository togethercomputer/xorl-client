id: ZORL-OPD-000
kind: standalone_opd_multiplication_smoke
base_manifest: k8s/qwen3-coder-30b-a3b-zorl-standalone-client-job.yaml
container: zorl-client
score_source: standalone_zorl_log
result_root: experiments/zorl/results/zorl_autoresearch/ZORL-OPD-000
env:
  RESULT_ROOT: /workspace/home/xorl-apanda-dev-zorl-consolidated/experiments/zorl/results/zorl_autoresearch/ZORL-OPD-000
  INFER_URL: http://zorl-ar-sglang-047.apanda.svc.cluster.local:30000
  TASK: opd_multiplication
  ZORL_OPD_DIGITS: "2"
  STEPS: "4"
  NUM_PAIRS: "4"
  B_SIGMA: "0.012"
