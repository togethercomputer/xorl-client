notes:
  - REVERSE-KL twin of MULTOPSD-001, on POOL B (8-replica zorl-ar-sglang-b). Identical no-filler 4x4-mult OPSD-ES setup EXCEPT OPSD_KL_MODE=reverse_kl_full (vs MULTOPSD-001 forward_kl_full). Tests the forward-vs-reverse KL direction for ES on the peaked-answer target. reverse_kl is the gradient OPD-port default that converges; forward_kl is mode-covering and was my ES default. Same NUM_PAIRS=512 population for a fair comparison; PAIRS_PER_SHARD=64 over 8 pool-B replicas (NUM_SHARDS auto = 8). Steps are ~2x slower than pool A (half the replicas) but per-step content is identical - compare at equal steps, not wall-clock.
  - Runs CONCURRENTLY with MULTOPSD-001 (pool A) since it uses the separate pool B. Same cold floor (~9pct 11/128) and the same greedy probe (PROBE_TEMPERATURE=0.0). WATCH probe exact_count vs MULTOPSD-001 - whichever KL direction climbs faster off the floor on this known-converging task.
