id: ARITH-015-WARM-T03
base_config: AM
slug: arith-015-warm-t03
buffer_label: arith-warm-t03
# R1 (overnight plan rev4, 2026-06-13): LEVER-1 ISOLATED. Identical to
# ARITH-005-OPD-WARM (answer-only reverse-KL, pause x1024, warm009 seed,
# corrected prompt-mask, clamp 10) EXCEPT prepare temperature 1.0 -> 0.3.
# Premise (science runbook §1d.1 / §7.1): warm answer-only OPD eroded its
# 0.238 seed to 0.094 because at T=1.0 only 3-17% of on-policy answer tokens
# land on CORRECT samples, so ~95% of supervision is teacher conditionals at
# wrong prefixes (teacher entropy 1.4-1.8 there). Lowering prepare temperature
# raises the correct-prefix fraction toward the seed's greedy 24%.
# Read: terminal control acc_pause + held-out trajectory vs 005's 0.094 (null)
# and the 0.238 seed. >0.13 and clearly > 0.094 => temperature rescues the
# bootstrap. <= 005 => temperature alone insufficient (OPRD/correct-prefix
# filtering needed). ce_mode quack_linear (4node_warm009 config, user 2026-06-13).
trainer_config: experiments/opd_profile/configs/qwen3_6_35b_a3b_opd_opdb_8node_warm009.yaml
gdn_backend: fla
score_mode: pause_vs_nopause
score_min_control_n: 1000
student_prefill_text: ' pause'
student_prefill_count: 1024
student_prefill_suffix: 'Answer: '
student_stop_sequences: '["\n"]'
teacher_cot_json_path: /shared/opd-coord/arith_ops6_nonempty_cot.json
prompts_json_path: /shared/opd-coord/arith_ops6_nonempty_prompts.json
num_prompts: 7892
default_num_steps: 101
default_prompts_per_step: 64
# THE one knob this arm changes vs ARITH-005-OPD-WARM (top-level so the
# generator templates it into the run command; default is 1.0).
temperature: 0.3
supervise_student_cot: false
opd_supervise_buffer_only: false
opd_hidden_match_coef: 0.0
learning_rate: 3e-6
max_new_tokens: 64
eval_max_new_tokens: 64
eval_num_problems: 1024
eval_accuracy_every: 5
eval_control_start_step: 100
eval_control_max_concurrency: 128
eval_answer_logprob_control: true
eval_answer_logprob_every: 5
eval_answer_logprob_batch_size: 64
eval_answer_logprob_max_concurrency: 16
eval_answer_logprob_distractor_control: true
eval_answer_logprob_distractor_offset: 1
opd_pipeline_rl: true
sampler_quiesce_before_sync: false
sync_method: p2p
serial_endpoint_sync: true
request_timeout: 1200
weight_sync_timeout: 900
opd_contrastive_corrupt_buffer_weight: 0.0
opd_contrastive_corrupt_answer_weight: 0.0
opd_contrastive_corrupt_buffer_mode: rotate
opd_contrastive_corrupt_buffer_span: memory_only
opd_positive_answer_weight: 0.0
opd_loss_max_clamp: 10.0
client_args:
  eval_task: arithmetic
  eval_prompts_json_path: /shared/opd-coord/arith_ops6_eval_1024.json
  eval_corrupt_pause_control: true
  opd_mask_prompt_kl: true
