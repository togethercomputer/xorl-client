notes:
  - No-filler OPSD (single-shot) ES port of the gradient 4x4-multiplication recipe (HOWTO_NOFILLER_OPSD_TRAINING.md). Student input is the chat-template user turn plus the literal Answer cue (no CoT, no filler), and it samples the answer directly. Teacher input is the same user turn with the precomputed CoT inserted as private scratch before the same Answer cue (self-distill, same base weights). Full-vocab forward KL is scored server-side over the student-sampled answer positions only.
  - TASK=mult, SCORE_MODE=opsd_kl_full, single-shot (OPSD_MULTI_TURN omitted, so it defaults to 0 - this is NOT multi-turn). Data is /shared/opd-coord/randnum_4digit_8192.json + the long-mt CoT randnum_4digit_8192_cot_mt8192.json (8192 usable aligned pairs). The teacher CoT has its own trailing answer line stripped so the Answer cue is shared, not duplicated.
  - Cold base-30B headroom (eval_mult_baseline.py, N=64, greedy) is direct_accuracy 0.031 with empty_frac 0.0 - near-zero direct accuracy, large room to climb (gradient arm lifted Q3.6-35B 0.594 to ~0.88; the cold floor here is lower because the base differs). PROBE_TEMPERATURE=0.0 reads GREEDY direct accuracy (the headline) every PROBE_INTERVAL=10 steps; watch the probe exact_count rise from the cold floor.
  - Pool note - only ONE ZORL client can run on the zorl-ar-sglang pool at a time. Do not launch while another client holds the pool.
