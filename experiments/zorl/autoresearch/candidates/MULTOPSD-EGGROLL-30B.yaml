notes:
  - EggRoll-ES port of the no-filler OPSD (single-shot) 4x4-multiplication recipe to Qwen3-30B-A3B-Instruct-2507 (the "for now" model while the Qwen3.6-35B shared-outer forward HANG is debugged by the dispatched agent - see SHARED_OUTER_LORA_MOE_35B_FORWARD_HANG.md). FIRST PURPOSE of this run is to answer "does the shared-outer (attention+experts) LoRA-MoE forward serve on the 30B?" - watch the cold probe / first LoRA /generate return (not hang -> watchdog -> pool recycle).
  - Attention + EXPERTS LoRA (shared_outer / hybrid_shared): init_zorl_adapter auto-detects MoE and emits mlp.experts.{w1,w2,w3} shared_outer tensors plus self_attn qkv/o. rank/alpha 16. Cold from a fresh adapter at qwen3-30b-a3b-r16-eggroll.
  - EggRoll: PERTURBATION_MODE=b_only, MERGE_EVERY_STEPS=1 (fold parent LoRA into base + re-init LoRA-A each step so the accumulated update is full-rank, not rank-capped), ELITIST_ROLLBACK=0 (snapshot can't capture a merged base). B_SIGMA=0.05, LEARNING_RATE=0.01.
  - Pool: 16x zorl-ar-sglang (TP=2, 30B) at max-lora-rank 16, mem-fraction 0.72, max-loaded-loras 16 (rank-16 shared-outer-MoE pool is ~230 MB/rank/lora; 80 loras OOMs the KV cache). PAIRS_PER_SHARD=5 x 16 replicas = 80 pairs -> 10 candidates/replica + parent = 11 <= 16 loaded-loras cap.
  - Only ONE ZORL client can run on these pools at a time. Cold base-30B direct accuracy is ~0.03 (large room to climb). PROBE_TEMPERATURE=0.0 reads GREEDY direct accuracy every 10 steps.
