# AMDAHL-044/047/048 pack4096 chunk4 path, but with manual FSDP module
# forward/backward prefetch enabled in the trainer config. Nearby Qwen3.6 configs
# mark forward prefetch as a large speed lever, while the no-CP/lm-head-TP path
# has been running with `enable_forward_prefetch: false`. This candidate screens
# that single scheduling knob before deeper model/collective work.
