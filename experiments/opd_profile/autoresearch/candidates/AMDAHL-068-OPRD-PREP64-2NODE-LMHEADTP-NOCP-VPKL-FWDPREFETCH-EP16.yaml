# Throughput/correctness topology diagnostic for the current two-node real
# all-layer SGLang-cache path. Same workload as AMDAHL-063/067, but changes the
# trainer topology from EP8 x eFSDP2 to EP16 x eFSDP1.
#
# Hypothesis: AMDAHL-067 repeat2 drift maps to source-rank dependence after the
# dispatcher changes batch-to-rank ownership. If EP16 removes the expert-FSDP
# dimension and repeat2 becomes repeat1-invariant, the next real fix should
# preserve that invariant while recovering the broader throughput target. If
# EP16 still drifts, the bug is not only the expert-FSDP dimension.
#
# This is diagnostic-only: it sets `load_checkpoint_optimizer:false` because
# the current checkpoint optimizer state is EP8-shaped. It is not a science
# default, not a repeat2/prepare128 promotion, and not promotable without
# same-capture loss/KL, static/K3, and same-workload 4-node real-cache gates.
