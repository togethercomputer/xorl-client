# Throughput-only two-node diagnostic for the current real all-layer SGLang-cache
# path. Same workload as the AMDAHL-048 baseline, AMDAHL-061 full-prefetch
# screen, and AMDAHL-062 backward-only screen, but sets
# `enable_forward_prefetch:true` and `enable_backward_prefetch:false`.
#
# Hypothesis: AMDAHL-061's large speed win and KL/loss drift came from the
# forward prefetch direction, not the backward direction. AMDAHL-062 already
# proved backward-only prefetch is loss-clean but too small. If AMDAHL-063
# drifts like AMDAHL-061, the next engine task is to debug forward-prefetch
# numerical semantics; if it is loss-clean, the old coupled mode interaction is
# the culprit.
#
# Not a science/default candidate and not promotable without matching
# same-capture loss, static/K3, and the same-workload 4-node real-cache gate.
#
# 2026-06-15 04:52Z status: measured and cleanup complete. The first refreshed
# kube-auth retry lost the apparent `110/089` two-node window to
# `wordle-rpl2n-sms20-0440`; the follow-up retry launched on `110/077`.
# Artifact:
# /shared/opd-coord/encoded_reasoning/results/qwen3_6_35b_self_distill/er-opd-q36-35b-slots/fb_replay/replay-vpkl-lmheadtp-nocp-realalllayer-sglangcache-full64-2node-forwardprefetch-chunk4-warmed-serveronly-4x-20260615T044953Z.jsonl
# Mean over 3 measured rows after warmup: server_forward_backward_s=4.140186,
# api_wall_s=4.335127. Loss/KL/hidden exactly match AMDAHL-048:
# 2.355041921 / 2.333743553 / 0.021298385. Forward-only prefetch is therefore
# loss-clean for this same-capture replay, but remains a throughput diagnostic,
# not a science/default promotion without static/K3 plus same-workload 4-node
# gates. Trainer controls were stopped and temporary trainer pods deleted.
