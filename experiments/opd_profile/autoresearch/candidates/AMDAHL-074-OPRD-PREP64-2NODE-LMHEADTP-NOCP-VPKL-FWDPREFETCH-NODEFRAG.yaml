# Throughput-only cleanup candidate based on AMDAHL-063. It keeps the same
# real all-layer SGLang-cache workload and forward-prefetch trainer topology,
# but opts out of the post-optimizer torch.cuda.empty_cache() via
# XORL_SKIP_EMPTY_CACHE_AFTER_OPTIM_STEP.
#
# Replay evidence on the current same-server AMDAHL-063 FLA stack:
# - Baseline artifact:
#   /shared/opd-coord/encoded_reasoning/results/qwen3_6_35b_self_distill/er-opd-q36-35b-slots/fb_replay/replay-vpkl-lmheadtp-nocp-realalllayer-sglangcache-full64-2node-forwardprefetch-currentbaseline74-realcache-cmp-chunk4-warmed-serveronly-4x-20260615T081347Z.jsonl
#   rows=3, server_forward_backward_s=4.219886, api_wall_s=4.495177,
#   clear_gradients_s=0.649127.
# - Initial replay-only no-GC/no-empty-cache probe:
#   /shared/opd-coord/encoded_reasoning/results/qwen3_6_35b_self_distill/er-opd-q36-35b-slots/fb_replay/replay-vpkl-lmheadtp-nocp-realalllayer-sglangcache-full64-2node-forwardprefetch-nodefrag74-realcache-cmp-chunk4-warmed-serveronly-4x-20260615T081415Z.jsonl
#   rows=3, server_forward_backward_s=3.648783, api_wall_s=3.917750,
#   clear_gradients_s=0.003312, no loss/KL/hidden drift.
# - Longer stability replay:
#   /shared/opd-coord/encoded_reasoning/results/qwen3_6_35b_self_distill/er-opd-q36-35b-slots/fb_replay/replay-vpkl-lmheadtp-nocp-realalllayer-sglangcache-full64-2node-forwardprefetch-nodefrag74-realcache-stability12-chunk4-warmed-serveronly-12x-20260615T081714Z.jsonl
#   warmup=1, measured rows=11, server_forward_backward_s=3.991819,
#   api_wall_s=4.269315, clear_gradients_s=0.003191. Loss/KL/hidden stayed
#   2.367357433 / 2.346086165 / 0.021271308 with valid_tokens=515.
# - Patched-engine optimizer-step proof on PR #376 commit db8ec2c7:
#   /shared/opd-coord/encoded_reasoning/results/qwen3_6_35b_self_distill/er-opd-q36-35b-slots/fb_replay/replay-vpkl-lmheadtp-nocp-realalllayer-sglangcache-full64-2node-forwardprefetch-nodefrag74-optimstep-proof-db8-chunk4-2x-20260615T083011Z.jsonl
#   warmup=1, measured rows=1, server_forward_backward_s=4.163849,
#   api_wall_s=4.354535, optim_wall_s=0.044204, and
#   optim_empty_cache_skipped_values=[true]. This proves the normal async
#   optimizer-step path carries the skip flag through the API and JSONL output.
#
# Interpretation: skipping cache cleanup is stable in this replay and gives a
# modest same-server 2-node win (about 5.4% server-side, 5.0% API-wall on the
# longer run). The larger 13% 3-row probe was optimistic because later rows
# exposed normal forward/backward variance.
#
# Optimizer-step smoke passed, but this is not a science/default candidate
# until both remaining gates pass:
# 1. Same-capture static/K3 gate passes.
# 2. Same-workload 4-node real-cache MFU gate beats the current 1.04% logical
#    MFU baseline without OOM/fragmentation drift.
