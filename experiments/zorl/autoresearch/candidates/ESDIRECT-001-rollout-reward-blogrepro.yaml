notes:
  - Reproduce the ES-blog Wordle result (Evolution as a Comparable Strategy to RL) on our infra.
  - DIRECT ENV REWARD via ES, NOT the OPSD-KL teacher (which taught format-not-solving). score_mode=rollout means each candidate plays the multi-turn game (rollout_completion) and the ES fitness is the composite reward (0.4 solved + 0.3 format + 0.2 info_gain + 0.1 turn_bonus). This is the blog setup; it tests whether our ES machinery learns Wordle when the reward rewards actual SOLVING/PLAY (it should, per the blog).
  - Blog hyperparams matched. B_SIGMA=0.01 (vs our prior 0.05), LEARNING_RATE=0.01, ROLLOUT_TEMPERATURE=0.0 (greedy rollouts since for ES the perturbation is the explorer), NUM_PAIRS=32 (~group_size 64), ~100 steps. Deltas - our model is Qwen3-30B-A3B-Instruct (blog used Qwen3-1.7B-Wordle-SFT), stronger and not Wordle-SFT'd but already decent format; TRAIN_SIZE=8 (blog 16) for faster iteration; public_reasoning student prompt.
  - WATCH reward_mean + probe exact_rate/format/partial CLIMBING (blog reward 0.51 to 0.885, format 0.48 to 0.80, wins to ~20-25%). If our ES climbs here, the ES works and the OPSD-KL objective was the blocker. If flat too, the ES machinery needs scrutiny.
  - score_mode=rollout is HEAVY (every candidate plays full games, 64 cand x 8 ex x ~6 turns). Tune NUM_PAIRS/TRAIN_SIZE from observed t_score. On the fixed-kernel pool (CANDIDATE_ROUTING=owner, no SMG).
