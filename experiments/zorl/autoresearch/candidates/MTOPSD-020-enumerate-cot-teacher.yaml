notes:
  - ENUMERATE-CoT teacher distillation. The teacher (enumerate style) keeps the privileged target but demonstrates PUBLIC candidate-narrowing the student can reproduce - it lists the consistent words, cites the discriminating feedback constraint, then lands on the target. Probe on base 30B - leak 0.0, solve 0.83, enum 0.67 (vs oblique 1.0/0.06, base policy_hint 0.5).
  - Hypothesis - distilling the enumerate teacher's CoT teaches the STUDENT to enumerate consistent words in its OWN reasoning, which is the inferable narrowing skill the student needs to solve at inference WITHOUT a candidate-list scaffold (user ruled out scaffolding to stay comparable to the gradient OPSD arm). The competence probe showed the floor is an enumeration gap (base 0/32 from transcript vs 16/32 given the list) - this run tests whether CoT distillation installs that enumeration ability into the weights.
  - Student WORDLE_PROMPT_STYLE=enumerate is instructed to list consistent words and narrow (it is NOT given the list - must produce it). ROLLOUT_MAX_NEW_TOKENS bumped 96 to 224 for the longer narrowing CoT. Full-reply KL (supervise reasoning + guess - user kept CoT supervision rather than masking). forward_kl_full, rank-4, CANDIDATE_ROUTING=owner, no SMG.
  - WATCH - eval exact_rate climbing off the ~2pct floor AND whether the student's probe CoT actually enumerates consistent words (inspect with inspect_cots.py). The MTOPSD-019 policy_hint run is the control (post-hoc justification, no enumeration, eval floored).
  - NaN-guard fix is in zorl_client.py (apply payload sanitized + degenerate=worst). Do NOT run heavy probes on the pool while this is live (a contended replica forward can NaN and, pre-fix, crash; the fix prevents the crash but a replica crash still drops its LoRAs/session).
