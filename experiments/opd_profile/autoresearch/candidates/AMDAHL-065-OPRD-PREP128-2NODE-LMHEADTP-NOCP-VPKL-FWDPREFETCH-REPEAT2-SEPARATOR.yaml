# Diagnostic follow-up to AMDAHL-064. Reuses the same 2-node forward-only
# prefetch trainer config, but the replay payload repeats the AMDAHL-047 full64
# capture as two 64-sample copies separated by a no-loss 4096-token dummy row.
# That dummy row forces the sequential packer to close the first copy's final
# packed microbatch before starting the second copy.
#
# Hypothesis: AMDAHL-064's improved valid-token throughput is real, but the
# same-capture loss/KL/hidden drift may be caused by changing packed neighbors
# at the copy boundary. If preserving the 64-sample pack boundary restores the
# AMDAHL-048/063 loss tuple while keeping a larger call, the next engine target
# is packed-neighbor invariance/attention/cache-indexing. If it still drifts,
# focus on larger-call metric/loss aggregation or rank-slice reduction.
#
# Result 2026-06-15 05:13Z: rejected as diagnostic/non-promotable. Mean over 2
# measured rows after 1 warmup was server_forward_backward_s=5.892664,
# api_wall_s=6.389314, valid_tokens=1030, loss=2.356476724,
# opd_kl=2.335177020, hidden=0.021299774. Preserving the first 64-sample pack
# boundary did not restore the AMDAHL-048/063 tuple and moved loss/KL further
# than AMDAHL-064, so the next audit should compare token-weighted
# numerators/denominators and packed-layout invariance directly.
#
# Not a science/default candidate and not promotable. The separator is an
# artificial no-loss diagnostic row, not a training recipe.
