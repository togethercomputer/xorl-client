  MAX_UPDATE_NORM: "20000"
  TRAIN_SIZE: "4"
  EVAL_SIZE: "8"
  ROLLOUT_MAX_NEW_TOKENS: "24"
  SCORE_MAX_WORKERS: "16"
  PROBE_INTERVAL: "1"
  PROBE_TEMPERATURE: "0.6"
  PROBE_N: "8"
