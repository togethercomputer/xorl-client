notes:
  - TRUE full-vocab OPSD via ZORL/ES; the KL reward is computed server-side on-GPU inside SGLang (sglang/srt/zorl/opd_kl.py), not from top-k logprobs. Replaces 016 dead top-1 reverse-KL.
  - score_mode=opsd_kl_full. Parent samples ONE shared hint-free CoT per example; the hinted teacher (hinted prefix + CoT, base model) is broadcast/cached on EVERY replica; each candidate (hint-free prefix + CoT, candidate LoRA) is scored by reward = -mean forward KL(teacher||student) over the CoT. forward_kl_full is mode-covering so the teacher answer mass is INJECTED, which top-k structurally could not do.
  - SINGLE-SHOT DIAGNOSTIC. Expect train KL to drop and the hint-free student to start emitting TRAIN answers (probe opsd_solved on train rises = injection works), while eval opsd_solved stays low (single-shot has no info to generalize to unseen hidden words). If train injection shows, the next run wires the multi-turn feedback game so it can generalize. If train opsd_solved stays 0, full-vocab injection itself is failing and the KL/teacher path needs investigation.
  - Probe SAMPLES the hint-free student and checks whether its CoT emits the target (wordle.extract_guesses) for opsd_solved/exact_match.
  - Perf reuses 016 (per_owner=64, train_size=8, ~512 co-batched seqs/replica); the forward is prefill-only with 1 throwaway token, lighter than 016 generate-per-candidate. Tune from step time.
